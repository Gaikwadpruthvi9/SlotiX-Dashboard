<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a101d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SLOTIX">
  <meta name="description" content="SLOTIX - Smart Parking System Login">
  <title>SLOTIX – Sign In</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icons/slotix-logo.svg">

  <!-- Google Fonts: Poppins & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Nunito:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="login.css?v=1">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      
      <!-- Top Action Bar (Theme Toggle) -->
      <div class="login-top-bar">
        <button id="themeToggleBtn" class="icon-btn-square" title="Toggle Light / Dark Mode" aria-label="Toggle theme">
          <!-- Sun Icon (visible in dark mode) -->
          <svg id="themeIconSun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <!-- Moon Icon (visible in light mode) -->
          <svg id="themeIconMoon" class="hidden" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>

      <!-- Main Login Content -->
      <main class="login-main">
        <!-- Prominent SLOTIX Logo -->
        <div class="login-logo-wrap" title="SLOTIX Smart Parking">
          <img src="images/slotix-logo.png" alt="SLOTIX Logo" class="login-logo-img">
        </div>

        <!-- Headings -->
        <div class="login-header-text">
          <h1 class="login-title">Welcome to SLOTIX</h1>
          <p class="login-subtitle">Park Smarter. Move Faster.</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="login-form" autocomplete="on">
          
          <!-- Email / Username Input -->
          <div class="form-field">
            <div class="input-container">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
              </span>
              <input 
                type="text" 
                id="loginUsername" 
                class="login-input" 
                placeholder="Email or Username" 
                autocomplete="username" 
                required
              >
            </div>
          </div>

          <!-- Password Input with Show/Hide Toggle -->
          <div class="form-field">
            <div class="input-container">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </span>
              <input 
                type="password" 
                id="loginPassword" 
                class="login-input" 
                placeholder="Password" 
                autocomplete="current-password" 
                required
              >
              <button 
                type="button" 
                id="togglePasswordBtn" 
                class="password-toggle-btn" 
                title="Show password" 
                aria-label="Toggle password visibility"
              >
                <!-- Eye Icon (Password Hidden) -->
                <svg id="eyeIconShow" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <!-- Eye Slash Icon (Password Shown) -->
                <svg id="eyeIconHide" class="hidden" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
          </div>

          <!-- Remember Me & Forgot Password Row -->
          <div class="form-options-row">
            <label class="remember-label" for="rememberMe">
              <input type="checkbox" id="rememberMe" class="custom-checkbox">
              <span class="custom-checkmark"></span>
              <span class="remember-text">Remember me</span>
            </label>

            <a href="#forgot" id="forgotPasswordLink" class="forgot-link">Forgot Password?</a>
          </div>

          <!-- Glowing Blue Sign In Button -->
          <button type="submit" id="signInBtn" class="login-submit-btn">
            <span class="btn-text">Sign In</span>
            <svg class="btn-arrow" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </form>
      </main>

      <!-- Small Footer -->
      <footer class="login-footer">
        <p>Technology for Smarter Parking</p>
      </footer>

    </div>
  </div>

  <script src="login.js?v=1"></script>
</body>
</html>
