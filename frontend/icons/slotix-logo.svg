<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Blue Parking Badge with Rounded Corners -->
  <rect x="20" y="20" width="130" height="130" rx="28" fill="#0284c7" />
  
  <!-- White Letter P -->
  <path d="M54 48h34c18 0 30 10.5 30 27s-12 27-30 27H74v34H54V48zm20 37h12c7.5 0 12-4.5 12-10s-4.5-10-12-10H74v20z" fill="#ffffff" />
  
  <!-- Car Silhouette at Bottom Right -->
  <g id="car-silhouette">
    <!-- Car Body -->
    <path d="M96 150c-2.5-4-5-8.5-4-13.5 1.5-6.5 7-10 13-11.5 5.5-1.5 14-8 23-14 8-5 18-7 30-7 14 0 25 3.5 31 10.5 4 4.5 8 9 12 11 4 2 8 4 10 7.5 2 3.5 1 7.5-1.5 10.5-2.5 3-7 4-11 4.5-1.5-7-7-12-14.5-12s-13 5-14.5 12h-40c-1.5-7-7-12-14.5-12s-13 5-14.5 12h-5z" fill="#22262a" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" />
    
    <!-- Windows -->
    <path d="M125 128h17v-13c-6.5.5-12.5 4-17 13zm22 0h24c-2.5-5.5-8-10-15-12.5-4.5-1.5-8.5-1-9-.5v13z" fill="#ffffff" />
    
    <!-- Wheels -->
    <circle cx="118.5" cy="150" r="9" fill="#22262a" stroke="#ffffff" stroke-width="2" />
    <circle cx="118.5" cy="150" r="3.5" fill="#ffffff" />
    
    <circle cx="173.5" cy="150" r="9" fill="#22262a" stroke="#ffffff" stroke-width="2" />
    <circle cx="173.5" cy="150" r="3.5" fill="#ffffff" />
  </g>
</svg>
