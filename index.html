<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLOTIX – Smart Parking System</title>
  <script>
    (function() {
      var isLoggedIn = localStorage.getItem('slotix_logged_in') === 'true';
      var selectedOrg = localStorage.getItem('slotix_selected_organisation');
      if (!isLoggedIn) {
        window.location.replace("frontend/login.html");
      } else if (!selectedOrg) {
        window.location.replace("frontend/select.html");
      } else {
        window.location.replace("frontend/index.html");
      }
    })();
  </script>
</head>
<body style="background-color: #0a101d; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; color: #6282a5;">
  <p>Loading SLOTIX Smart Parking...</p>
</body>
</html>
